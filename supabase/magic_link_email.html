<h2>Sign in to PIPPA</h2>
<p>Use the secure button below to sign in. The link can be used only once.</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
     style="background:#12867d;color:#ffffff;padding:12px 20px;text-decoration:none;border-radius:6px;display:inline-block">
    Sign in to PIPPA
  </a>
</p>
<p>If the button does not work, return to PIPPA and enter the complete code shown below:</p>
<p style="font-size:24px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>If you did not request this email, you can ignore it.</p>
